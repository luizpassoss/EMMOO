# Ambiente completo: MySQL + API + Web (Nginx).
# Uso: docker compose up --build   →   http://localhost:8080
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: emmoo
      MYSQL_USER: emmoo
      MYSQL_PASSWORD: emmoo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo # "hoje" da escola (ex.: cancelar aulas futuras ao inativar aluno)
      PORT: 3333
      DB_DRIVER: mysql
      DATABASE_URL: mysql://emmoo:emmoo@db:3306/emmoo
      JWT_SECRET: troque-este-segredo-em-producao
      CORS_ORIGIN: http://localhost:8080
    # Sincroniza o schema, cria os dados iniciais e sobe a API.
    command: sh -c "npx prisma db push --skip-generate && node prisma/seed.js && node src/server.js"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3333:3333"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db_data:
