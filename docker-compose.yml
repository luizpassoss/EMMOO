# Ambiente completo, como em produção: Nginx (proxy reverso) → EMMOO (API e front, do Dockerfile da raiz) → MySQL.
# Na AWS, o mesmo desenho roda com a imagem do ECR (deploy/aws/docker-compose.yml), atrás do CloudFront.
# Antes da primeira vez: copie .env.example para .env (nesta pasta) e preencha os segredos.
# Uso: docker compose up --build   →   http://localhost:8080
# Primeira escola (com o cadastro público fechado): docker compose exec app npm run escola:criar -- --help (ver README)
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: emmoo
      MYSQL_USER: emmoo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
    # Sem porta publicada: o banco só é acessível pelo app, na rede interna do Docker.
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DB_DRIVER: mysql
      DATABASE_URL: mysql://emmoo:${MYSQL_PASSWORD}@db:3306/emmoo
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      APP_URL: ${APP_URL:-http://localhost:8080} # endereço público: links dos e-mails e HTTPS
      CADASTRO_ESCOLAS: ${CADASTRO_ESCOLAS:-fechado} # "aberto" libera o cadastro público de escolas novas
      SMTP_URL: ${SMTP_URL:-} # e-mail dos alertas e do "esqueci minha senha" (opcional)
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-}
      # Atrás do Nginx: o IP de quem acessa vem do X-Forwarded-For que ele envia (limite de tentativas de login).
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DADOS_DEMO: ${DADOS_DEMO:-nao} # "sim" cria a escola de demonstração (senhas públicas do README)
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PORTA:-8080}:80"
    environment:
      ORIGEM_SEGREDO: "" # localmente, sem CloudFront na frente: nenhum cabeçalho exigido
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - app

volumes:
  db_data:
