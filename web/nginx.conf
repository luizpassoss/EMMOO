server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API: encaminhada ao container "api", mantendo o prefixo /api.
  location ^~ /api/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Manifesto do app instalável: tipo certo (nem toda versão do nginx o conhece) e sem cache longo.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Arquivos estáticos com cache.
  location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # SPA: rotas do React são resolvidas pelo index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
